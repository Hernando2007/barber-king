name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar la sintaxis de cada archivo
        run: |
          find . -name '*.js' -not -path './node_modules/*' -print0 \
            | xargs -0 -n1 node --check

      - name: Correr los tests
        run: npm test

  flutter:
    name: App (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/barber_king_app

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Misma versión que la que se usa en desarrollo: si cambia, se cambia
          # aquí a propósito y no por sorpresa.
          flutter-version: 3.47.1
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Análisis estático
        run: dart analyze lib test

      - name: Correr los tests
        run: flutter test
