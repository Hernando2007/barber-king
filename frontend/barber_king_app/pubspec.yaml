name: barber_king_app
description: Aplicación Barber King.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.3

  # Peticiones HTTP
  dio: ^5.9.0

  # Almacenamiento seguro del token JWT
  flutter_secure_storage: ^9.2.4

  # Manejo de estados de carga e imágenes
  cached_network_image: ^3.4.1

  # Formato de fechas
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/image/